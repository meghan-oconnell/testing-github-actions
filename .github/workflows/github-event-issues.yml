name: Verify events.issues structure for label change
run-name: Label set by ${{ github.actor }}
on:
    issues:
        types: [labeled]
jobs:
    notify:
        if: github.event.label.name == 'needs-testing'
        runs-on: ubuntu-latest
        steps:
            - run: | 
                echo ${{ toJSON(format('Jobs status: {0}. Issue: *{1}* is ready for testing, set by {2}. Issue assignee: {3}. Link: {4}', job.status, github.event.issue.title || 'Unknown Issue Name', github.actor, github.event.issue.assignee.login || 'Unknown Issue Assignee', github.event.issue.html_url || 'Unknown Issue URL' ))}}


